[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grokeos"
version = "1.0.0"
description = "Aluminum Maxwell FEOS table with a vacuum pressure floor"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools.package-data]
grokeos = ["data/*.npz"]
